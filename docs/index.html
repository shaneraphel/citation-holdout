<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Citation hold-out</title>
  <style>body{font-family:ui-sans-serif,system-ui,sans-serif;margin:2rem;max-width:44rem}</style>
</head>
<body>
  <h1>Citation hold-out</h1>
  <p>A missing citation is left unscored. It is not written down as zero. Built to sit in front of Apertus prompts.</p>
  <pre id="out"></pre>
  <script>
    function score(grounded, citation) {
      if (citation == null) return null;
      return grounded ? 1 : 0;
    }
    document.getElementById("out").textContent =
      "missing citation: " + score(true, null) + "\n" +
      "grounded: " + score(true, "art. 5") + "\n" +
      "ungrounded: " + score(false, "art. 5");
  </script>
</body>
</html>
